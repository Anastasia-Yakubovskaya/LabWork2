name: C++ CI

on:
  push:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]
  pull_request:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libgtest-dev build-essential
          
      - name: Build Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp *.a /usr/lib
          
      - name: Build project and tests
        run: |
          make
          make test
          
      - name: Run tests
        run: |
          if [ -f "./game_tests" ]; then
            ./game_tests
          else
            echo "Error: Test executable not found!"
            find . -name "game_tests" -type f
            exit 1
          fi
