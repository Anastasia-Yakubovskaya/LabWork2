name: C++ CI

on:
  push:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]
  pull_request:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev build-essential
          
      - name: Build Google Test libraries
        run: |
          cd /usr/src/gtest
          sudo g++ -std=c++17 -I. -c *.cc
          sudo ar -rv libgtest.a *.o
          sudo cp libgtest.a /usr/lib
          
      - name: Build project and tests
        run: |
          make
          make test
          
      - name: Verify test executable exists
        run: |
          if [ ! -f "./game_tests" ]; then
            echo "::error::Test executable not found!"
            echo "Current directory contents:"
            ls -la
            echo "Files in tests directory:"
            ls -la tests/
            exit 1
          fi
          
      - name: Run tests
        run: ./game_tests
