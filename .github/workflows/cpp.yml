name: C++ CI

on:
  push:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]
  pull_request:
    branches: [main, CreatingGameBranch, descriptionBranch, realisation, testingbranch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libgtest-dev build-essential
          
      - name: Build Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp *.a /usr/lib
          
      - name: Build project and tests
        run: |
          make
          make test
          
      - name: Verify test executable exists
        id: check-test
        run: |
          if [ ! -f "./game_tests" ]; then
            echo "::error::Test executable 'game_tests' not found!"
            find . -name "*test*" -type f
            exit 1
          fi
          echo "Test executable found at $(pwd)/game_tests"
          
      - name: Run tests
        run: |
          ./game_tests || echo "::warning::Tests failed with exit code $?"
